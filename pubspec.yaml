name: qrn_app
description: "Daily Quran - Your daily Quran companion"
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # Required for intl / localization
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  flutter_native_splash: ^2.3.8
  sensors_plus: ^4.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  geolocator: ^10.1.0
  flutter_compass: ^0.8.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  permission_handler: ^11.0.0
  flutter_launcher_icons: ^0.13.1

  # ===== PUSH NOTIFICATIONS =====
  flutter_local_notifications: ^17.0.0

  # ===== UTILITIES =====
  intl: any                      # Let flutter_localizations pin the version
  share_plus: ^10.1.4
  flutter_tts: ^4.2.0
  just_audio: ^0.9.46
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename: ^3.1.0
  image: ^4.5.4

flutter_native_splash:
  color: "#1A5F4A"
  image: assets/logo.jpg
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app-icon.jpeg"
  adaptive_icon_background: "#1A5F4A"
  adaptive_icon_foreground: "assets/app-icon.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app-icon.jpeg"
    background_color: "#1A5F4A"
    theme_color: "#1A5F4A"
  windows:
    generate: true
    image_path: "assets/app-icon.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app-icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/nav/
    - assets/images/
    - assets/nav/nav_home.png
    - assets/nav/nav_quran.png
    - assets/nav/nav_prayer.png
    - assets/nav/nav_more.png
    - assets/nav/nav_settings.png
    - assets/images/quran_header_bg.jpg
    - assets/images/surah_detail_header.jpg
    - assets/images/prayer/prayer_bg_fajr.jpg
    - assets/images/prayer/prayer_bg_sunrise.jpg
    - assets/images/prayer/prayer_bg_dhuhr.jpg
    - assets/images/prayer/prayer_bg_asr.jpg
    - assets/images/prayer/prayer_bg_night.jpg
    - assets/images/more/
    - assets/images/qibla/
    - assets/images/home/
    - assets/images/home/read_quran.jpg
    - assets/images/home/home_verse_bg.jpg
    - assets/data/
    - assets/data/quran-index.json
    - assets/audio/azan2.mp3
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/ScheherazadeNew-Regular.ttf
    - assets/fonts/surah-name-v4.ttf

  fonts:
    - family: SurahNameV4
      fonts:
        - asset: assets/fonts/surah-name-v4.ttf
    - family: IndoPak
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: ArabicNaskh
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf