name: qrn_app
description: "Daily Quran - Your daily Quran companion"
publish_to: 'none'

version: 1.0.1+1
environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  flutter_native_splash: ^2.3.8
  sensors_plus: ^4.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  geolocator: ^10.1.0
  permission_handler: ^11.0.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#1A5F4A"
  image: assets/logo.jpg
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app-icon.jpeg"
  adaptive_icon_background: "#1A5F4A"
  adaptive_icon_foreground: "assets/app-icon.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app-icon.jpeg"
    background_color: "#1A5F4A"
    theme_color: "#1A5F4A"
  windows:
    generate: true
    image_path: "assets/app-icon.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app-icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/